name: Publish post

on:
  repository_dispatch:
    types: [publish-post]
  push:
    branches: [main]
    paths:
      - "content/posts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ (github.event.client_payload != null && github.event.client_payload.slug) || github.run_id }}
  cancel-in-progress: false

jobs:
  commit:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.create.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Commit the post with the Actions token
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_PAYLOAD_FILE: ${{ runner.temp }}/publish-payload.json
        run: |
          cat > "$PUBLISH_PAYLOAD_FILE" <<'EOF'
          ${{ toJson(github.event.client_payload) }}
          EOF
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --import ./scripts/register-ts-test.mjs scripts/commit-dispatch.mjs

  publish:
    needs: commit
    if: ${{ !cancelled() && (needs.commit.result == 'success' || needs.commit.result == 'skipped') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[linkedin]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish ready posts and record ids
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --import ./scripts/register-ts-test.mjs scripts/publish-linkedin.mjs
